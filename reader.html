<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading — Bookshelf</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gutendex.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/reader.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('bs_theme')||'light'}catch(e){}</script>
</head>
<body class="reader-body">

<!-- Chapters slide-in panel -->
<div class="chapters-overlay" id="chaptersOverlay"></div>
<div class="chapters-panel" id="chaptersPanel">
  <div class="chapters-panel__header">
    <h3>Chapters</h3>
    <button class="btn btn--icon" id="closePanelBtn" title="Close">✕</button>
  </div>
  <div class="chapters-list" id="chaptersList"></div>
</div>

<!-- Toolbar -->
<header class="reader-toolbar">
  <button class="btn btn--sm btn--secondary" id="tocBtn" title="Table of Contents">☰</button>
  <span class="reader-toolbar__title" id="toolbarTitle">Loading…</span>

  <div class="toolbar-group">
    <!-- Font size -->
    <button class="font-size-btn" id="fontDecBtn" title="Decrease font size">A−</button>
    <button class="font-size-btn" id="fontIncBtn" title="Increase font size">A+</button>
  </div>

  <div class="toolbar-sep"></div>

  <div class="toolbar-group" title="Reading theme">
    <button class="theme-btn theme-btn--light active" data-theme="light" aria-label="Light theme"></button>
    <button class="theme-btn theme-btn--sepia" data-theme="sepia" aria-label="Sepia theme"></button>
    <button class="theme-btn theme-btn--dark" data-theme="dark" aria-label="Dark theme"></button>
  </div>

  <div class="toolbar-sep"></div>

  <div class="toolbar-group">
    <button class="font-btn active" id="fontSans" title="Sans-serif font">Aa</button>
    <button class="font-btn" id="fontSerif" title="Serif font" style="font-family:Georgia">Aa</button>
  </div>

  <div class="toolbar-sep"></div>

  <button class="btn btn--sm btn--secondary" id="fullscreenBtn" title="Toggle fullscreen">⛶</button>
  <a href="" class="btn btn--sm btn--secondary" id="backBtn" title="Back to book">✕</a>
</header>

<!-- Progress -->
<div class="progress-bar"><div class="progress-bar__fill" id="progressFill"></div></div>

<!-- Reading area -->
<div class="reader-scroll" id="readerScroll">
  <div class="reader-loading" id="readerLoading">
    <div class="spinner"></div>
    <p>Fetching book content…</p>
  </div>
  <article class="reader-content" id="readerContent" style="display:none"></article>
</div>

<script type="module" src="js/reader.js?v=2"></script>
</body>
</html>
